<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#222;--sub:#807d74;--ln:#e6e3da;--exp:#d4453b;--inc:#2a8a57;--sav:#2f6fd0;--ac:#2b2b2b;--acx:#fff;--r:14px;--r2:10px;--rp:99px;--rf:50%;--bw:1px;--sh:none;--blur:0px;--font:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;--ls:normal;--bgimg:var(--bg);--sheet:var(--card)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232322;--tx:#eee;--sub:#9a978d;--ln:#38372f;--exp:#ef7a70;--inc:#5cc48b;--sav:#6fa3ee;--ac:#eee;--acx:#111}}
:root[data-theme="dark"]{--bg:#171716;--card:#232322;--tx:#eee;--sub:#9a978d;--ln:#38372f;--exp:#ef7a70;--inc:#5cc48b;--sav:#6fa3ee;--ac:#eee;--acx:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bgimg);background-attachment:fixed;color:var(--tx);font:15px/1.4 var(--font);letter-spacing:var(--ls);padding-bottom:140px}
main{max-width:560px;margin:0 auto;padding:12px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:var(--bw) solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:12px;margin-bottom:10px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:18px}
.nav button{background:none;border:var(--bw) solid var(--ln);border-radius:var(--r2);width:40px;height:36px;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sum small{display:block;color:var(--sub);font-size:11px}
.sum b{font-size:15px}
.sav-row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.sav-row b{color:var(--sav);font-size:15px}
.exp{color:var(--exp)}.inc{color:var(--inc)}.sav{color:var(--sav)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cell{min-height:62px;border:1px solid var(--ln);border-radius:min(var(--r2),9px);padding:2px 3px;background:var(--card);text-align:left;overflow:hidden;font-size:10px;line-height:1.25}
.cell.e{border:none;background:none}
.cell.sel{outline:2px solid var(--ac)}
.cell.today .d{background:var(--ac);color:var(--acx);border-radius:8px;padding:0 5px}
.cell .d{font-size:11px;display:inline-block;margin-bottom:1px}
.cell div{white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .m small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;border:var(--bw) solid var(--ln);border-radius:var(--rp);padding:4px 11px;margin:0 6px 6px 0;background:none;font-size:13px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;padding:8px 0;border:var(--bw) solid var(--ln);border-radius:var(--r2);background:none}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
input{font:inherit;color:inherit;background:var(--bg);border:var(--bw) solid var(--ln);border-radius:var(--r2);padding:9px 10px;width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:12px 0;font-size:12px;color:var(--sub)}
.tabs button.on{color:var(--tx);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:var(--rf);border:0;background:var(--ac);color:var(--acx);font-size:28px;box-shadow:0 3px 10px #0004}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
#sheet .box{background:var(--sheet);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));width:100%;max-width:560px;border-radius:var(--r) var(--r) 0 0;padding:16px;max-height:92%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;padding:11px;border-radius:var(--r2);border:var(--bw) solid var(--ln);background:none}
.btns .pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btns .del{color:var(--exp)}
.tg{display:flex;gap:6px;margin-bottom:6px}
.tg button{width:44px;border-radius:var(--r2);border:var(--bw) solid var(--ln);background:none;color:var(--exp)}
.note{font-size:12px;color:var(--sub);text-align:center;margin:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .t{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.goal .t button{background:none;border:1px solid var(--ln);border-radius:8px;padding:2px 10px;font-size:12px}
.goal .st{font-size:13px}
.goal .bar{margin:0;height:10px}
#pic{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px;z-index:15}
#pic.on{display:flex}
#pic img{max-width:92vw;max-height:70vh;width:auto;height:auto;object-fit:contain;border-radius:12px;background:var(--card)}
#pic p{color:#fff;margin:0;font-weight:700;font-size:18px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gal div{position:relative;background:var(--bg);border:1px solid var(--ln);border-radius:10px;height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal img{max-width:100%;max-height:100%;object-fit:contain}
.gal button{position:absolute;top:3px;right:3px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;border:0;background:#000b;color:#fff;font-size:12px}
svg.ch text{fill:var(--sub);font-size:10px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:8px}
.st3 small{display:block;color:var(--sub);font-size:11px}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.skin{background:none;border:var(--bw) solid var(--ln);border-radius:var(--r2);padding:10px;text-align:left}
.skin.on{border-color:var(--ac);outline:2px solid var(--ac)}
.skin small{display:block;color:var(--sub);font-size:11px}
.dots{display:flex;gap:4px;margin-bottom:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:1px solid #0002}
/* 1 甘い×ピンク×丸い */
:root[data-skin="sweet"]{--bg:#fff0f5;--card:#fff;--tx:#5b3a47;--sub:#a67b8c;--ln:#ffd3e2;--exp:#ff5c8a;--inc:#2fb58f;--sav:#6f94ff;--ac:#ff7eb0;--acx:#fff;--r:24px;--r2:16px;--rp:99px;--bw:2px;--sh:0 5px 0 #ffd3e2;--font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--bgimg:radial-gradient(circle at 90% 0,#ffe0ee 0,transparent 40%),#fff0f5;--sheet:#fff}
:root[data-skin="sweet"] .fab{box-shadow:0 5px 0 #e0558a}
/* 2 上品×ベージュ×細い */
:root[data-skin="elegant"]{--bg:#f3ece2;--card:#faf6ef;--tx:#3d352c;--sub:#8a7d6c;--ln:#d9ccb8;--exp:#a4503f;--inc:#5f7a52;--sav:#4a6a85;--ac:#5b4a36;--acx:#faf6ef;--r:3px;--r2:2px;--rp:2px;--bw:1px;--font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--ls:.06em;--sheet:#faf6ef}
:root[data-skin="elegant"] .bar{height:3px;border-radius:0}
:root[data-skin="elegant"] .nav b{letter-spacing:.2em;font-weight:500}
:root[data-skin="elegant"] .fab{box-shadow:none}
/* 3 モード×黒×直線 */
:root[data-skin="mode"]{color-scheme:dark;--bg:#0b0b0b;--card:#141414;--tx:#f2f2f2;--sub:#8c8c8c;--ln:#2c2c2c;--exp:#ff4d4d;--inc:#3ddc84;--sav:#4da3ff;--ac:#fff;--acx:#000;--r:0px;--r2:0px;--rp:0px;--rf:0px;--bw:1px;--font:"Zen Kaku Gothic New","Helvetica Neue","Hiragino Sans",sans-serif;--ls:.03em;--sheet:#141414}
:root[data-skin="mode"] .card{border-left:3px solid var(--tx)}
:root[data-skin="mode"] .bar,:root[data-skin="mode"] .bar i,:root[data-skin="mode"] .cell.today .d{border-radius:0}
:root[data-skin="mode"] .fab{box-shadow:none}
/* 4 ドリーミー×パステル×ぼかし */
:root[data-skin="dreamy"]{--bg:rgba(255,255,255,.55);--card:rgba(255,255,255,.5);--tx:#4a4668;--sub:#8c88ad;--ln:rgba(160,140,230,.22);--exp:#ee6f9e;--inc:#52b9a6;--sav:#7f9bf0;--ac:#a58cf0;--acx:#fff;--r:28px;--r2:18px;--rp:99px;--bw:1px;--sh:0 10px 34px rgba(165,140,240,.28);--blur:14px;--font:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--sheet:rgba(255,255,255,.82);--bgimg:radial-gradient(circle at 12% 8%,#ffd3ea 0,transparent 45%),radial-gradient(circle at 88% 18%,#c9e0ff 0,transparent 45%),radial-gradient(circle at 50% 95%,#e0d0ff 0,transparent 55%),#f7f2ff}
:root[data-skin="dreamy"] .card{border-color:rgba(255,255,255,.85)}
:root[data-skin="dreamy"] .fab{box-shadow:0 0 24px 4px rgba(165,140,240,.55)}
/* 5 ダークフェミニン×深色×装飾的 */
:root[data-skin="dfem"]{color-scheme:dark;--bg:#1d0f1a;--card:#2a1627;--tx:#f3e3ea;--sub:#b794a6;--ln:#5a3350;--exp:#ff7a98;--inc:#8fd1a6;--sav:#9db4ff;--ac:#c9a35e;--acx:#2a1627;--r:10px;--r2:6px;--rp:99px;--bw:1px;--sh:inset 0 0 0 3px #2a1627,inset 0 0 0 4px rgba(201,163,94,.45);--font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--ls:.05em;--sheet:#2a1627;--bgimg:radial-gradient(circle at 50% -10%,#4a1f43 0,transparent 55%),#1d0f1a}
:root[data-skin="dfem"] .card,:root[data-skin="dfem"] .skin{border-color:rgba(201,163,94,.6)}
:root[data-skin="dfem"] .nav b::before{content:"❦ ";color:var(--ac)}
:root[data-skin="dfem"] .nav b::after{content:" ❦";color:var(--ac)}
:root[data-skin="dfem"] .tabs button.on{color:var(--ac)}
:root[data-skin="dfem"] .fab{box-shadow:0 0 0 3px #1d0f1a,0 0 0 4px var(--ac)}
/* 6 透明感×白青×ガラス */
:root[data-skin="glass"]{--bg:rgba(255,255,255,.55);--card:rgba(255,255,255,.55);--tx:#17324d;--sub:#6a869f;--ln:rgba(60,130,200,.2);--exp:#e0566a;--inc:#1fa68a;--sav:#2a7de1;--ac:#2a7de1;--acx:#fff;--r:18px;--r2:12px;--rp:99px;--bw:1px;--sh:0 8px 32px rgba(40,100,180,.16),inset 0 1px 0 #fff;--blur:20px;--sheet:rgba(255,255,255,.85);--bgimg:radial-gradient(circle at 8% 0,#bfe0ff 0,transparent 50%),radial-gradient(circle at 100% 45%,#d4eaff 0,transparent 45%),linear-gradient(160deg,#f4faff,#e2f0ff)}
:root[data-skin="glass"] .card{border-color:rgba(255,255,255,.95)}
:root[data-skin="glass"] .fab{box-shadow:0 6px 20px rgba(42,125,225,.45)}
.btns .lbtn{flex:1;text-align:center;padding:11px;border-radius:var(--r2);border:var(--bw) solid var(--ln)}
</style></head>
<body>
<script>try{var k=localStorage.getItem('kk-skin');if(k&&k!=='std')document.documentElement.dataset.skin=k}catch(e){}</script>
<main id="app"><p class="note">読み込み中…</p></main>
<button class="fab" id="fab" data-act="add" aria-label="追加" hidden>＋</button>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"><div class="box" id="box"></div></div>
<div id="pic" data-act="picx"><img id="pic-i" alt=""><p>記録しました!</p></div>
<canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const sh=n=>n>=10000?(Math.round(n/1000)/10)+'万':n.toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,9);
const TY={exp:'出費',inc:'入金',sav:'浮いた'},COL={exp:'var(--exp)',inc:'var(--inc)',sav:'var(--sav)'};
const now=new Date(),tdy=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
const mk=(y,m)=>`m-${y}-${p2(m)}`;
const mkAt=ym=>`m-${ym}`;
const tg=(t,names)=>names.map(n=>({id:uid8(),name:n}));
let S={y:now.getFullYear(),m:now.getMonth()+1,tab:'cal',sel:tdy,bt:'exp',cm:'d',tx:[],
 tags:{exp:tg(0,['食費','日用品','交通費','住居','光熱費','通信費','娯楽','その他']),inc:tg(0,['給料','副収入','その他']),sav:tg(0,['外食を我慢','コンビニ','飲み物','衝動買い','その他'])}};
let db=null,uid=null,F=null,armed=null,G={months:{}},IM=[],picT=0;

/* ---- storage: db (per-person private) with localStorage fallback ---- */
async function load(k){
 try{ if(db){const s=await db.collection('data/users/'+uid).doc(k).get();return s.exists?s.data():null}
  return JSON.parse(localStorage.getItem('kk-'+k)||'null')}catch(e){return null}}
async function save(k,v){
 try{ if(db)await db.collection('data/users/'+uid).doc(k).set(v); else localStorage.setItem('kk-'+k,JSON.stringify(v))}catch(e){console.error(e)}}
const curKey=()=>mk(S.y,S.m);
async function loadMonth(){const d=await load(curKey());S.tx=(d&&d.tx)||[];render()}
async function init(){
 try{ if(window.claude){const u=await claude.use('user');uid=u?await u.id():null;db=uid?await claude.use('db'):null}}catch(e){}
 const t=await load('tags'); if(t)S.tags=t; else save('tags',S.tags);
 const pf=await load('prefs');if(pf&&pf.skin)applySkin(pf.skin,false);
 const im=await load('images');if(im&&im.list)IM=im.list;
 const gl=await load('goals');if(gl&&gl.months)G=gl;
 await loadMonth();
 if(!db)$('#app').insertAdjacentHTML('beforeend','<p class="note">このブラウザ内にのみ保存されています</p>');
}

/* ---- helpers ---- */
const sum=(t,f)=>S.tx.filter(x=>x.t===t&&(!f||f(x))).reduce((a,x)=>a+x.a,0);
const tagName=(t,id)=>{const g=S.tags[t].find(x=>x.id===id);return g?g.name:'タグなし'};
const colorOf=(t,id)=>{const i=S.tags[t].findIndex(x=>x.id===id);return `hsl(${(i<0?0:i)*47+(t==='exp'?5:t==='inc'?140:215)} 55% 52%)`};
const sgn=x=>x.t==='exp'?'-':x.t==='inc'?'+':'';
const amt=x=>`<b class="${x.t}">${x.t==='sav'?'':sgn(x)}${yen(x.a)}</b>`;
function month(d){S.y+=d;}
function shift(d){S.m+=d;if(S.m>12){S.m=1;S.y++}if(S.m<1){S.m=12;S.y--}S.sel=null;loadMonth()}

/* ---- views ---- */
function goalOf(y,m){const k=`${y}-${p2(m)}`,ks=Object.keys(G.months).filter(x=>x<=k).sort();return ks.length?G.months[ks[ks.length-1]]:0}
function goalCard(e){
 const g=goalOf(S.y,S.m),cur=now.getFullYear()*12+now.getMonth()+1,n=S.y*12+S.m;
 if(!g)return `<div class="card goal"><button class="chip" style="margin:0" data-act="goal">＋ 出費の目標額を設定</button></div>`;
 const d=Math.abs(g-e);let st='';
 if(n<cur)st=e<=g?`<b class="inc">🎉 目標達成!</b> ${yen(d)} 下回りました`:`<b class="exp">未達成</b> ${yen(d)} 超過`;
 else if(n===cur)st=e<=g?`目標内 ・ 残り <b class="inc">${yen(d)}</b>`:`<b class="exp">目標超過</b> ${yen(d)} オーバー`;
 return `<div class="card goal"><div class="t"><span>出費の目標 <b>${yen(g)}</b></span><button data-act="goal">変更</button></div><div class="bar"><i style="width:${Math.min(100,e/g*100)}%;background:${e<=g?'var(--inc)':'var(--exp)'}"></i></div><div class="st">${st||'&nbsp;'}</div></div>`}
function openGoal(){
 F=null;const g=goalOf(S.y,S.m);
 $('#box').innerHTML=`<b>${S.y}年${S.m}月の出費目標</b><label>目標額(円)</label><input id="g-a" inputmode="numeric" value="${g||''}" placeholder="例: 100000"><p class="note" style="text-align:left">設定は翌月以降にも引き継がれます。空欄で保存すると、この月の設定をやめて前月までの目標に戻ります。</p><div class="btns"><button data-act="fx">閉じる</button><button class="pri" data-act="gs">保存</button></div>`;
 $('#sheet').classList.add('on')}
async function fillHist(){
 if(!$('#hist'))return;const cur=now.getFullYear()*12+now.getMonth()+1;let h='';
 for(let i=0;i<6;i++){let y=S.y,m=S.m-i;while(m<1){m+=12;y--}
  const g=goalOf(y,m);if(!g)continue;
  const d=i?await load(mk(y,m)):{tx:S.tx};
  const e=((d&&d.tx)||[]).filter(x=>x.t==='exp').reduce((a,x)=>a+x.a,0),end=y*12+m<cur,ok=e<=g;
  h+=`<div class="row" style="cursor:default"><div class="m">${y}年${m}月<small>${yen(e)} / 目標 ${yen(g)}</small></div><b class="${ok?'inc':'exp'}">${end?(ok?'🎉達成':'未達成'):(ok?'進行中':'超過')}</b></div>`}
 const el=$('#hist');if(el)el.innerHTML=h||'<p class="note">目標を設定すると履歴が表示されます</p>'}
function head(){
 const e=sum('exp'),i=sum('inc'),v=sum('sav');
 return `<div class="nav"><button data-act="prev">‹</button><b>${S.y}年${S.m}月</b><button data-act="next">›</button></div>
 <div class="card"><div class="sum"><div><small>入金</small><b class="inc">${yen(i)}</b></div><div><small>出費</small><b class="exp">${yen(e)}</b></div><div><small>収支</small><b>${yen(i-e)}</b></div></div>
 <div class="sav-row"><span>浮いたお金(収支には含まない)</span><b>${yen(v)}</b></div></div>${goalCard(e)}`}

function entryRow(x,showDate){
 return `<button class="row" data-act="edit" data-id="${x.id}"><div class="m"><span class="chip" style="margin:0;padding:1px 8px;font-size:11px;border-color:${colorOf(x.t,x.g)}">${x.t==='sav'?'浮 ':''}${esc(tagName(x.t,x.g))}</span><small>${showDate?x.d.slice(8)+'日 ':''}${esc(x.n||'')}</small></div>${amt(x)}</button>`}

function calView(){
 const first=(new Date(S.y,S.m-1,1).getDay()+6)%7,n=new Date(S.y,S.m,0).getDate(),agg={};
 S.tx.forEach(x=>{const a=agg[x.d]||(agg[x.d]={exp:0,inc:0,sav:0});a[x.t]+=x.a});
 let c=['月','火','水','木','金','土','日'].map(d=>`<div class="h">${d}</div>`).join('');
 for(let i=0;i<first;i++)c+='<div class="cell e"></div>';
 for(let d=1;d<=n;d++){const k=`${S.y}-${p2(S.m)}-${p2(d)}`,a=agg[k];

async function shrink(f,max){

 return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}

async function fillChart(){
 const mode=S.cm;if(!$('#chart'))return;
 const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
 const mo=async(y,m)=>{const d=(y===S.y&&m===S.m)?{tx:S.tx}:await load(mk(y,m));return((d&&d.tx)||[]).filter(x=>x.t==='exp')};
 let L=[],V=[],ttl='';
 if(mode==='d'){const n=new Date(S.y,S.m,0).getDate();V=Array(n).fill(0);L=V.map((_,i)=>i+1);S.tx.filter(x=>x.t==='exp').forEach(x=>V[+x.d.slice(8)-1]+=x.a);ttl=`${S.y}年${S.m}月 日別`}
 else if(mode==='m'){for(let i=11;i>=0;i--){let y=S.y,m=S.m-i;while(m<1){m+=12;y--}L.push(m+'月');V.push((await mo(y,m)).reduce((a,x)=>a+x.a,0))}ttl='月別(直近12か月)'}
 else{const end=(S.y===now.getFullYear()&&S.m===now.getMonth()+1)?new Date(now.getFullYear(),now.getMonth(),now.getDate()):new Date(S.y,S.m,0);
  const st=new Date(end.getFullYear(),end.getMonth(),end.getDate()-(end.getDay()+6)%7-77),days=[],ks=new Set(),map={};
  for(let i=0;i<84;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i);days.push(d);ks.add(d.getFullYear()*100+d.getMonth()+1)}
  for(const k of ks)(await mo(Math.floor(k/100),k%100)).forEach(x=>map[x.d]=(map[x.d]||0)+x.a);
  for(let w=0;w<12;w++){let t=0;for(let j=0;j<7;j++)t+=map[iso(days[w*7+j])]||0;V.push(t);L.push((days[w*7].getMonth()+1)+'/'+days[w*7].getDate())}ttl='週別(直近12週・月曜始まり)'}
 const el=$('#chart');if(!el||S.cm!==mode||S.tab!=='chart')return;
 const W=340,H=190,pl=40,pr=12,pt=16,pb=24,mx=Math.max(...V,1),X=i=>pl+(V.length<2?0:i*(W-pl-pr)/(V.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/mx);
 const tot=V.reduce((a,b)=>a+b,0),step=Math.ceil(V.length/6),mi=V.indexOf(Math.max(...V));
 el.innerHTML=`<b>${ttl}</b><svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px">
 ${[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--ln)"/><text x="${pl-4}" y="${Y(mx*f)+3}" text-anchor="end">${sh(mx*f)}</text>`).join('')}
 <path d="${V.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join('')}" fill="none" stroke="var(--exp)" stroke-width="2" stroke-linejoin="round"/>
 ${V.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${V.length>14?2:3}" fill="var(--exp)"/>`).join('')}
 ${L.map((l,i)=>i%step===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`:'').join('')}
 ${mx>1?`<text x="${Math.min(Math.max(X(mi),pl+14),W-pr-14)}" y="${Y(V[mi])-6}" text-anchor="middle" style="fill:var(--exp);font-weight:700">${sh(V[mi])}</text>`:''}</svg>
 <div class="st3"><div><small>合計</small><b>${yen(tot)}</b></div><div><small>平均</small><b>${yen(tot/V.length)}</b></div><div><small>最大</small><b>${yen(V[mi])}</b></div></div>`}

const add=o=>P.push({vx:0,vy:0,g:0,d:1,r:0,vr:0,l:0,m:90,s:8,sw:0,ph:0,...o});
function draw(x,p){const s=p.s;
 if(p.k==='rect')x.fillRect(-s/2,-s/4,s,s/2);
 else if(p.k==='circ'){x.beginPath();x.arc(0,0,s,0,7);x.fill()}
 else if(p.k==='star'){x.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}
 else if(p.k==='heart'){x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s,-s*.3,-s*.5,-s,0,-s*.4);x.bezierCurveTo(s*.5,-s,s,-s*.3,0,s*.35);x.fill()}
 else{x.beginPath();x.ellipse(0,0,s*.8,s,0,0,7);x.fill();x.beginPath();x.moveTo(0,s);x.quadraticCurveTo(-4,s+14,2,s+26);x.lineWidth=1;x.globalAlpha*=.6;x.stroke()}}
function loop(){
 const c=$('#fx'),dp=devicePixelRatio||1,x=c.getContext('2d');
 x.setTransform(dp,0,0,dp,0,0);x.clearRect(0,0,c.width,c.height);
 P=P.filter(p=>p.l<p.m);
 for(const p of P){p.l++;p.vx*=p.d;p.vy=p.vy*p.d+p.g;p.x+=p.vx+(p.sw?Math.sin(p.l*.08+p.ph)*p.sw:0);p.y+=p.vy;p.r+=p.vr;
  x.save();x.globalAlpha=Math.max(0,Math.min(1,(p.m-p.l)/25));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=x.strokeStyle=p.c;draw(x,p);x.restore()}
 raf=(P.length||T)?requestAnimationFrame(loop):0}
function celebrate(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const c=$('#fx'),dp=devicePixelRatio||1,W=innerWidth,H=innerHeight;
 if(!raf){c.width=W*dp;c.height=H*dp}
 const E=Math.random()*5|0;
 if(E===0){/* クラッカー */
  [0,1].forEach(side=>{for(let i=0;i<46;i++){const a=-R(.5,1.35),sp=R(9,19),vx=Math.cos(a)*sp;
   add({k:'rect',x:side?W-10:10,y:H-10,vx:side?-vx:vx,vy:Math.sin(a)*sp,g:.28,d:.985,c:pick(COLS),s:R(6,11),r:R(0,6),vr:R(-.3,.3),m:R(70,110)})}})}
 else if(E===1){/* 花火 */
  [0,380,760].forEach(dl=>{T++;setTimeout(()=>{T--;const cx=R(.2,.8)*W,cy=R(.15,.45)*H,col=pick(COLS);
   for(let i=0;i<44;i++){const a=i/44*Math.PI*2,sp=R(2.5,6.5);add({k:'circ',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.05,d:.97,c:col,s:R(2,3.5),m:R(50,80)})}
   if(!raf)raf=requestAnimationFrame(loop)},dl)})}
 else if(E===2){/* 星 */
  for(let i=0;i<36;i++)add({k:'star',x:R(0,W),y:R(-H*.4,-10),vx:R(-.5,.5),vy:R(2.5,5),c:pick(['#ffd54a','#ffe98a','#ffb400']),s:R(8,16),vr:R(-.1,.1),m:200})}
 else if(E===3){/* ハート */
  for(let i=0;i<22;i++)add({k:'heart',x:R(.05,.95)*W,y:H+R(0,H*.3),vy:-R(2,4.5),c:pick(['#ff5a8a','#ff86a8','#ff3d6e','#ffa0c0']),s:R(10,22),sw:R(.3,1),ph:R(0,6),m:R(130,190)})}
 else{/* 風船 */
  for(let i=0;i<12;i++)add({k:'balloon',x:R(.08,.92)*W,y:H+R(20,200),vy:-R(2.5,4),c:pick(COLS),s:R(16,24),r:R(-.2,.2),sw:R(.2,.7),ph:R(0,6),m:200})}
 if(!raf)raf=requestAnimationFrame(loop)}
init();
</script></body></html>
